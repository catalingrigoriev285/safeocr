[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safeocr"
version = "0.1.0"
description = "Privacy-by-design ID document anonymization (OCR + PII black boxes) exposed as an MCP server"
requires-python = ">=3.10"

[project.scripts]
safeocr-mcp = "safeocr.mcp_server:main"

[tool.setuptools.packages.find]
where = ["server"]

[tool.pytest.ini_options]
pythonpath = ["server"]
testpaths = ["tests"]
