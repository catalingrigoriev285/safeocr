# SafeOCR configuration. Any key can be overridden by env vars:
#   SAFEOCR_<SECTION>__<KEY>, e.g. SAFEOCR_OCR__BACKEND=tesseract
# Relative paths are resolved against the repository root.

ocr:
  backend: stub            # stub | tesseract
  lang: ron+eng            # tesseract languages (needs `brew install tesseract tesseract-lang`)
  tesseract_cmd: null      # optional explicit path to the tesseract binary
  psm: 6                   # tesseract page segmentation mode
  dark_threshold: 0.85     # stub OCR: a word whose box is >= 85% dark is treated as unreadable

paths:
  samples_dir: data/samples
  uploads_dir: data/uploads
  store_dir: data/store
  # ocr_document(path) only accepts images from these folders
  allowed_input_dirs:
    - data/samples
    - data/uploads

redact:
  padding: 4               # px added around each word box
  color: "#000000"

pii:
  enabled_types: [CNP, NAME, ADDRESS, ID_SERIES, ID_NUMBER, MRZ]

# Local model (Ollama). Used by the chat agent; `enabled` additionally turns on the
# (future) SLM PII classifier inside detect_pii. Never a cloud model.
llm:
  enabled: true
  provider: ollama
  model: qwen3:1.7b
  base_url: http://localhost:11434
  think: false             # qwen3 reasoning mode (slower on CPU)
  temperature: 0.3
  timeout: 180
  max_tool_rounds: 4       # model-initiated tool calls per chat turn

# End-of-task voice announcement (see README "Voice (TTS)"). The spoken text contains only
# counts and the verification result, never personal values.
tts:
  enabled: true
  engine: piper            # none | macos | piper | openai
  language: ro             # language of the spoken text: ro | en (must match the voice)
  macos:                   # built-in `say` (macOS only, offline)
    voice: Ioana           # ro_RO voice; `say -v '?'` lists all
    rate: null
  piper:                   # pip install piper-tts (offline, CPU)
    model: models/piper/ro_RO-mihai-medium.onnx
  openai:                  # any OpenAI-compatible /v1/audio/speech server
    base_url: http://localhost:11434/v1   # Ollama >= 0.40.11 (Apple Silicon); Kokoro: http://localhost:8880/v1
    model: phonon          # Ollama: phonon (en), phonon:40m-fr|de|es|pt; Kokoro: kokoro
    voice: ""              # empty = server default
    api_key_env: ""        # env var with an API key (remote providers only)

api:
  cors_origins:
    - http://localhost:3000
    - http://127.0.0.1:3000
